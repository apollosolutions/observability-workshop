services:
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.47.0
    ports:
      - 9000:9000
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command: --web.enable-lifecycle  --config.file=/etc/prometheus/prometheus.yml --web.listen-address="0.0.0.0:9000" --web.enable-remote-write-receiver --enable-feature=native-histograms
  grafana:
    image: grafana/grafana:10.1.1
    container_name: grafana
    user: "0"
    volumes:
      - "./grafana/data:/var/lib/grafana"
      - "./grafana/provisioning:/etc/grafana/provisioning"
    ports:
      - 3000:3000
  otel-collector:
    container_name: collector
    image: otel/opentelemetry-collector-contrib:0.128.0    # https://github.com/open-telemetry/opentelemetry-collector-releases
    hostname: robertsMac
    user: "0"
    volumes:
      - ./collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    ports:
      - 4317:4317
      - 4318:4318
      - 8888:8888
      - 9875:9875
    environment:
      - DD_API_KEY
      - OTEL_RESOURCE_ATTRIBUTES="service.name=observability-workshop-router,deployment.environment.name=local"
  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.49
    command: --collector.otlp.grpc.host-port 0.0.0.0:4310 --collector.otlp.http.host-port 0.0.0.0:4311
    ports:
      - 16686:16686
