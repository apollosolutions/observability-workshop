receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    collection_interval: 10s
    scrapers:
      paging:
        metrics:
          system.paging.utilization:
            enabled: true
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.physical.count:
            enabled: true
          system.cpu.logical.count:
            enabled: true
          system.cpu.frequency:
            enabled: true
      disk:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      load:
      memory:
      network:
      processes:
  # The prometheus receiver scrapes metrics needed for the OpenTelemetry Collector Dashboard.
  prometheus/receiver:
    config:
      scrape_configs:
        - job_name: 'otelcol'
          scrape_interval: 10s
          static_configs:
            - targets: [ 'localhost:8888' ]

processors:
  # The batch processor batches telemetry data into larger payloads.
  # It is necessary for the Datadog traces exporter to work optimally,
  # and is recommended for any production pipeline.
  batch:
    # Datadog APM Intake limit is 3.2MB. Let's make sure the batches do not
    # go over that.
    send_batch_max_size: 1000
    send_batch_size: 100
    timeout: 10s

# doesnt work with mac
#  resourcedetection/docker:
#    detectors: [env, docker]
#    timeout: 2s
#    override: false

  resourcedetection:
    # bare metal
    detectors: [ env, system ]
    system:
      resource_attributes:
        os.description:
          enabled: true
        host.arch:
          enabled: true
        host.cpu.vendor.id:
          enabled: true
        host.cpu.family:
          enabled: true
        host.cpu.model.id:
          enabled: true
        host.cpu.model.name:
          enabled: true
        host.cpu.stepping:
          enabled: true
        host.cpu.cache.l2.size:
          enabled: true
#    # GCP
#    detectors: [ env, gcp, system ]
#    # AWS
#    detectors: [ env, ecs, ec2, system ]
#    # Azure
#    detectors: [ env, azure, system ]
#    timeout: 2s
#    override: false

#  resourcedetection/docker:
#    detectors: [ env, docker ]
#    timeout: 2s
#    override: false


# Read more about exporters here:
# https://opentelemetry.io/docs/collector/configuration/#connectors
connectors:
  # The Datadog connector is necessary for APM Trace metrics.
  datadog/connector:

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: jaeger:4310
    tls:
      insecure: true
  datadog/exporter: #https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/exporter/datadogexporter and https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/exporter/datadogexporter/examples/collector.yaml
    traces:
      span_name_as_resource_name: true
      trace_buffer: 500
    metrics:
      # Add all resource attributes as tags for metrics https://docs.datadoghq.com/opentelemetry/mapping/semantic_mapping/?tab=datadogexporter#metrics-attribute-mapping
      resource_attributes_as_tags: true
      histograms: # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/exporter/datadogexporter/examples/collector.yaml#L277
        mode: distributions
        send_aggregation_metrics: true
    api:
      key: ${env:DD_API_KEY} # Set your Datadog API key as an environment variable
      #site: "datadoghq.com" # Use "datadoghq.eu" if you're in the EU region
extensions:
  health_check:
  zpages:

service:
  extensions: [health_check, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resourcedetection]
      exporters: [otlp, datadog/connector,datadog/exporter]
    metrics:
      receivers: [hostmetrics, otlp, prometheus/receiver, datadog/connector]
      processors: [batch, resourcedetection]
      exporters: [datadog/exporter]

