supergraph:
  introspection: true
  path: /
  listen: 0.0.0.0:4000

homepage:
  enabled: false

sandbox:
  enabled: true

telemetry:
  apollo:
    field_level_instrumentation_sampler: 0.3
    errors:
      subgraph:
        all:
          redact: false
          send: true
  instrumentation:
    spans: # span configuration example https://www.apollographql.com/docs/graphos/routing/observability/telemetry/instrumentation/spans#span-configuration-example
      mode: spec_compliant
      router:
        attributes:
          # Standard attributes
          http.response.status_code: true
          error.type: true
          dd.trace_id: true
          otel.name: router
          operation.name: "router"
          resource.name:
            request_method: true
          graphql.operation_name:
            operation_name: "string"
          environment:
            env: ENVIRONMENT
            default: local
      supergraph:
        attributes:
          graphql.operation.name: true
          graphql.operation.type: true
          otel.name: supergraph
          operation.name: "supergraph"
          resource.name:
            operation_name: string
      subgraph:
        attributes:
          otel.name: subgraph
          operation.name: "subgraph"
          resource.name:
            subgraph_operation_name: string
    instruments: # production instruments example https://www.apollographql.com/docs/graphos/routing/observability/telemetry/instrumentation/instruments#production-instrumentation-example
      router:
        http.server.request.duration:
          # Adding subgraph name, response status code from the router and the operation name
          attributes:
            http.response.status_code: true
            graphql.operation.name:
              operation_name: string
            # This attribute will be set to true if the response contains graphql errors
            graphql.errors:
              on_graphql_error: true
#            resource.name:
#              request_method: true
        http.server.response.body.size:
          attributes:
            graphql.operation.name:
              operation_name: string
      subgraph:
        http.client.request.duration:
          attributes:
            subgraph.name: true
            http.response.status_code:
              subgraph_response_status: code
            graphql.operation.name:
              supergraph_operation_name: string
            # This attribute will be set to true if the response contains graphql errors
            graphql.errors:
              subgraph_on_graphql_error: true
        http.client.request.body.size:
          attributes:
            subgraph.name: true
      connector: # connector isnt part of the standard production instrumentation
        http.client.request.body.size: true
        http.client.request.duration: true
        http.client.response.body.size: true
  exporters:
    metrics:
      prometheus:
        enabled: true
        path: /metrics
        listen: 0.0.0.0:9999
      common:
        service_name: observability-workshop-router
        service_namespace: observability-workshop
        resource:
          "deployment.environment.name": "local"
          "host.name": "robertsMac"
      otlp:
        temporality: delta
        enabled: true
        endpoint: http://localhost:4317
        protocol: grpc
    tracing:
      propagation:
        jaeger: false
        datadog: true # do we need this?
      common:
        parent_based_sampler: true
        service_name: observability-workshop-router
        service_namespace: observability-workshop
        sampler: 0.3
      otlp:
        temporality: delta
        enabled: true
        endpoint: http://localhost:4317
        protocol: grpc
include_subgraph_errors:
  all: true
rhai: {}

plugins:
  experimental.expose_query_plan: true
