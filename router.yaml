supergraph:
  introspection: true
  path: /
  listen: 0.0.0.0:4000

homepage:
  enabled: false

sandbox:
  enabled: true
connectors:
  preview_connect_v0_3: true
  debug_extensions: true
cors:
  # Set to false to disallow any origin and rely exclusively on `origins`
  # Defaults to true
  allow_any_origin: true
preview_response_cache:
  enabled: true
  debug: true
  invalidation:
    listen: 0.0.0.0:4000
    path: /invalidation
  subgraph:
    all:
      enabled: true
      redis:
        urls: ["redis://localhost:6379"]
      invalidation:
        enabled: true
        shared_key: ${env.INVALIDATION_SHARED_KEY}

telemetry:
  apollo:
    field_level_instrumentation_sampler: 0.3
    errors:
      subgraph:
        all:
          redact: false
          send: true
  instrumentation:
    # events:
    #   subgraph:
    #     response:
    #       level: info
    #       condition:
    #         all:
    #           - eq:
    #               - subgraph_name: true
    #               - static: posts
    #           - eq:
    #               - response_cache: hit
    #               - 0
    instruments:
      cache: # Cache instruments configuration
        apollo.router.operations.response.cache: # A counter which counts the number of cache hit and miss for subgraph requests
          attributes:
            graphql.type.name: true # Include the entity type name. default: false
            subgraph.name: # Custom attributes to include the subgraph name in the metric
              subgraph_name: true
            supergraph.operation.name: # Add custom attribute to display the supergraph operation name
              supergraph_operation_name: string
      # You can add more custom attributes using subgraph selectors
      router:
        http.server.request.duration:
          attributes:
            http.response.status_code: true
            graphql.operation.name:
              operation_name: string
      subgraph:
        http.client.request.duration:
          attributes:
            subgraph.name: true
            http.response.status_code:
              subgraph_response_status: code
            response.cache.hit:
              response_cache: hit
            response.cache.status:
              response_cache_status: status

    spans:
      mode: spec_compliant
      router:
        attributes:
          environment:
            env: ENVIRONMENT
            default: development
  exporters:
    metrics:
      prometheus:
        enabled: true
        path: /metrics
        listen: 0.0.0.0:9999
      common:
        service_name: router
        service_namespace: observability-workshop
        views:
          - name: apollo.router.operations.response_cache.cache_hit
            aggregation:
              histogram:
                buckets:
                  - 25.0
                  - 50.0
                  - 75.0
                  - 100.0
          - name: apollo.router.operations.response_cache.fetch.entity
            aggregation:
              histogram:
                buckets:
                  - 5
                  - 10
                  - 50
                  - 100
                  - 500
    tracing:
      propagation:
        jaeger: true
      common:
        parent_based_sampler: true
        service_name: router
        service_namespace: observability-workshop
        sampler: 0.3
      otlp:
        enabled: true
        endpoint: http://localhost:43178
        protocol: grpc
include_subgraph_errors:
  all: true
rhai: {}

headers:
  all:
    request:
      - propagate:
          named: cache-control

plugins:
  experimental.expose_query_plan: true
