supergraph:
  introspection: true
  path: /
  listen: 0.0.0.0:4000

# Coprocessor configuration, use this and coprocessor.py to log all requests to the router and throw errors 50% of the time
# coprocessor:
#   url: http://localhost:8081 # Coprocessor endpoint
#   timeout: 2s
#   router:
#     request:
#       headers: true # Forward all headers
#       context: true # Forward request context
#     response:
#       headers: true # Forward response headers
#       context: true # Forward response context
#   subgraph:
#     all: # Apply to all subgraphs
#       request:
#         headers: true
#         context: true
#       response:
#         headers: true
#         context: true

homepage:
  enabled: false

sandbox:
  enabled: true

telemetry:
  apollo:
    field_level_instrumentation_sampler: 0.3
    errors:
      subgraph:
        all:
          redact: false
          send: true
  instrumentation:
    spans: # span configuration example https://www.apollographql.com/docs/graphos/routing/observability/telemetry/instrumentation/spans#span-configuration-example
      default_attribute_requirement_level: recommended # change to required for less data https://www.apollographql.com/docs/graphos/routing/observability/telemetry/instrumentation/spans#default_attribute_requirement_level
      router:
        attributes: # attribute options https://www.apollographql.com/docs/graphos/routing/observability/telemetry/instrumentation/standard-attributes#router
          http.response.status_code: true
          error.type: true
          otel.name: router
          operation.name: router
          resource.name:
            request_method: true
          graphql.operation_name:
            operation_name: "string"

      supergraph:
        attributes:
          otel.name: supergraph
          operation.name: supergraph
          resource.name:
            operation_name: string
          graphql.operation.name: true
          otel.status_code:
            static: ERROR
            condition:
              eq:
              - true
              - on_graphql_error: true
          otel.status_description:
            response_errors: $[0].extensions.code
          error.message:
            response_errors: $[0].message
          graphql.errors:
            on_graphql_error: true

      subgraph:
        attributes:
          otel.name: subgraph
          operation.name: subgraph
          resource.name:
            subgraph_operation_name: string
          otel.status_code:
            static: ERROR
            condition:
              eq:
              - true
              - subgraph_on_graphql_error: true
          otel.status_description:
            subgraph_response_errors: $[0].extensions.code
          # Datadog Error Tracking: error.*
          error.message:
            subgraph_response_errors: $[0].message
          error.stack:
            subgraph_response_errors: $[0].extensions.stacktrace
          graphql.errors:
            subgraph_on_graphql_error: true

    instruments: # production instruments example https://www.apollographql.com/docs/graphos/routing/observability/telemetry/instrumentation/instruments#production-instrumentation-example
      router:
        http.server.request.duration:
          # Adding subgraph name, response status code from the router and the operation name
          attributes:
            http.response.status_code: true
            graphql.operation.name: # remove for cost reasons
              operation_name: string # remove for cost reasons
            # This attribute will be set to true if the response contains graphql errors
            graphql.errors:
              on_graphql_error: true
#            resource.name:
#              request_method: true
#        http.server.response.body.size: # doesnt work
#          attributes:
#            graphql.operation.name:
#              operation_name: string
      subgraph:
        http.client.request.duration:
          attributes:
            subgraph.name: true
            http.response.status_code:
              subgraph_response_status: code
            graphql.operation.name:
              supergraph_operation_name: string
            # This attribute will be set to true if the response contains graphql errors
            graphql.errors:
              subgraph_on_graphql_error: true
        http.client.request.body.size:
          attributes:
            subgraph.name: true
      connector: # connector isnt part of the standard production instrumentation
        http.client.request.body.size: true
        http.client.request.duration: true
        http.client.response.body.size: true
  exporters:
    metrics:
      prometheus:
        enabled: true
        path: /metrics
        listen: 0.0.0.0:9999
      common:
        resource: ## Resource attributes are used to identify the service in datadog see https://docs.datadoghq.com/opentelemetry/mapping/semantic_mapping/?tab=datadogexporter and https://opentelemetry.io/docs/specs/semconv/resource/ and https://www.apollographql.com/docs/graphos/routing/observability/telemetry/metrics-exporters/overview#resource
          "deployment.environment.name": "local"
          "host.name": "robertsMac"
          "service.name": "observability-workshop-router"
      #          "service.version": "2.3.0" # no need to specify, it's populated by the router
      otlp:
        temporality: delta # <-- REQUIRED for Datadog
        enabled: true
        endpoint: http://localhost:4317
        protocol: grpc
    tracing:
      propagation: # https://www.apollographql.com/docs/graphos/routing/observability/telemetry/trace-exporters/overview#propagation
        trace_context: true
      common:
        sampler: 1.0 # Send all traces to collector for intelligent sampling
        resource: ## Resource attributes are used to identify the service in datadog see https://docs.datadoghq.com/opentelemetry/mapping/semantic_mapping/?tab=datadogexporter and https://opentelemetry.io/docs/specs/semconv/resource/ and https://www.apollographql.com/docs/graphos/routing/observability/telemetry/metrics-exporters/overview#resource
          "deployment.environment.name": "local"
          "host.name": "robertsMac"
          "service.name": "observability-workshop-router"
      #          "service.version": "2.3.0" # no need to specify, it's populated by the router
      otlp:
        temporality: delta
        enabled: true
        endpoint: http://localhost:4317
        protocol: grpc
include_subgraph_errors:
  all: true
rhai: {}

plugins:
  experimental.expose_query_plan: true
