supergraph:
  introspection: true
  path: /
  listen: 0.0.0.0:4000

homepage:
  enabled: false

sandbox:
  enabled: true

telemetry:
  apollo:
    field_level_instrumentation_sampler: 0.3
    errors:
      subgraph:
        all:
          redact: false
          send: true
  instrumentation:
    spans: # span configuration example https://www.apollographql.com/docs/graphos/routing/observability/telemetry/instrumentation/spans#span-configuration-example
      mode: spec_compliant
      router:
        attributes:
          # Standard attributes
          http.response.status_code: true
          error.type: true
          otel.name: router
          operation.name: "router"
          resource.name:
            request_method: true
          graphql.operation_name:
            operation_name: "string"
          environment:
            env: ENVIRONMENT
            default: local
          # **CRITICAL for Log Correlation**: Adds 'dd.trace_id' to spans, which is
          # then automatically included in OTLP logs for Datadog correlation.
          dd.trace_id: true
          # **CRITICAL for Error Tracking**: Sets the span status to 'error'
          # if a GraphQL error is present, enabling Datadog's error tracking.
          otel.status_code:
            static: error
            condition:
              eq:
                - true
                - on_graphql_error: true
          # Conditional custom attribute
          otel.status_description: # You can conditionally put a status description attribute on your span if it respect the condition
            static: "there was an error"
            condition: # http response status code != 200 or it contains a graphql error in the payload
              any:
                - not:
                    eq:
                      - response_status: code
                      - 200
                - eq:
                    - on_graphql_error
                    - true
      supergraph:
        attributes:
          otel.name: supergraph
          operation.name: "supergraph"
          resource.name:
            operation_name: string
          # Apply the value which was retrieved from the Cookie or
          # the x-api-key Header in the `in-house.rhai` supergraph_service
          "apollo_key_account":
            response_context: "apollo-key-account"
          cost.estimated: true
          cost.actual: true
          cost.result: true
          graphql.operation.name: true
          otel.status_code:
            static: error
            condition:
              exists:
                response_errors: $[0].extensions.code # Here is an example to get the first error code, `on_graphql_error` is also available for supergraph
      subgraph:
        attributes:
          otel.name: subgraph
          operation.name: "subgraph"
          resource.name:
            subgraph_operation_name: string
    instruments: # production instruments example https://www.apollographql.com/docs/graphos/routing/observability/telemetry/instrumentation/instruments#production-instrumentation-example
      router:
        http.server.request.duration:
          # Adding subgraph name, response status code from the router and the operation name
          attributes:
            http.response.status_code: true
            graphql.operation.name: # remove for cost reasons
              operation_name: string # remove for cost reasons
            # This attribute will be set to true if the response contains graphql errors
            graphql.errors:
              on_graphql_error: true
#            resource.name:
#              request_method: true
#        http.server.response.body.size: # doesnt work
#          attributes:
#            graphql.operation.name:
#              operation_name: string
      subgraph:
        http.client.request.duration:
          attributes:
            subgraph.name: true
            http.response.status_code:
              subgraph_response_status: code
            graphql.operation.name:
              supergraph_operation_name: string
            # This attribute will be set to true if the response contains graphql errors
            graphql.errors:
              subgraph_on_graphql_error: true
        http.client.request.body.size:
          attributes:
            subgraph.name: true
      connector: # connector isnt part of the standard production instrumentation
        http.client.request.body.size: true
        http.client.request.duration: true
        http.client.response.body.size: true
  exporters:
    metrics:
      prometheus:
        enabled: true
        path: /metrics
        listen: 0.0.0.0:9999
      common:
        resource: ## Resource attributes are used to identify the service in datadog see https://docs.datadoghq.com/opentelemetry/mapping/semantic_mapping/?tab=datadogexporter and https://opentelemetry.io/docs/specs/semconv/resource/ and https://www.apollographql.com/docs/graphos/routing/observability/telemetry/metrics-exporters/overview#resource
          "deployment.environment.name": "local"
          "host.name": "robertsMac"
          "service.name": "observability-workshop-router"
      #          "service.version": "2.3.0" # no need to specify, it's populated by the router
      otlp:
        temporality: delta # <-- REQUIRED for Datadog
        enabled: true
        endpoint: http://localhost:4317
        protocol: grpc
    tracing:
      propagation:
        jaeger: false
        datadog: true # do we need this?
      common:
        sampler: 1.0 # Send all traces to collector for intelligent sampling
        parent_based_sampler: true # Enable parent-based sampling
        resource: ## Resource attributes are used to identify the service in datadog see https://docs.datadoghq.com/opentelemetry/mapping/semantic_mapping/?tab=datadogexporter and https://opentelemetry.io/docs/specs/semconv/resource/ and https://www.apollographql.com/docs/graphos/routing/observability/telemetry/metrics-exporters/overview#resource
          "deployment.environment.name": "local"
          "host.name": "robertsMac"
          "service.name": "observability-workshop-router"
      #          "service.version": "2.3.0" # no need to specify, it's populated by the router
      otlp:
        temporality: delta
        enabled: true
        endpoint: http://localhost:4317
        protocol: grpc
include_subgraph_errors:
  all: true
rhai: {}

plugins:
  experimental.expose_query_plan: true
