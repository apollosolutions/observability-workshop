supergraph:
  introspection: true
  path: /
  listen: 0.0.0.0:4000

homepage:
  enabled: false

sandbox:
  enabled: true
connectors:
  preview_connect_v0_3: true
  debug_extensions: true
cors:
  # Set to false to disallow any origin and rely exclusively on `origins`
  # Defaults to true
  allow_any_origin: true
experimental_response_cache:
  enabled: true
  debug: true
  invalidation:
    listen: 0.0.0.0:4000
    path: /invalidation
  subgraph:
    all:
      enabled: true
      postgres:
        url: "postgres://localhost:5432"
      ttl: 30s # overrides the global TTL
      invalidation:
        enabled: true
        shared_key: "invalidate"

telemetry:
  apollo:
    field_level_instrumentation_sampler: 0.3
    errors:
      subgraph:
        all:
          redact: false
          send: true
  instrumentation:
    instruments:
      router:
        http.server.request.duration:
          attributes:
            http.response.status_code: true
            graphql.operation.name:
              operation_name: string
      subgraph:
        http.client.request.duration:
          attributes:
            subgraph.name: true
            http.response.status_code:
              subgraph_response_status: code
            # response.cache.hit:
            #   response_cache: hit

    spans:
      mode: spec_compliant
      router:
        attributes:
          environment:
            env: ENVIRONMENT
            default: development
  exporters:
    metrics:
      prometheus:
        enabled: true
        path: /metrics
        listen: 0.0.0.0:9999
      common:
        service_name: router
        service_namespace: observability-workshop
    tracing:
      propagation:
        jaeger: true
      common:
        parent_based_sampler: true
        service_name: router
        service_namespace: observability-workshop
        sampler: 0.3
      otlp:
        enabled: true
        endpoint: http://localhost:43178
        protocol: grpc
include_subgraph_errors:
  all: true
rhai: {}

plugins:
  experimental.expose_query_plan: true
