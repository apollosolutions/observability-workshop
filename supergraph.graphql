schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION)
  @link(url: "https://specs.apollo.dev/cacheTag/v0.1", for: EXECUTION)
  @link(url: "https://specs.apollo.dev/connect/v0.3", for: EXECUTION)
  @join__directive(graphs: [COMMENTS], name: "link", args: {url: "https://specs.apollo.dev/connect/v0.2", import: ["@connect", "@source"]})
  @join__directive(graphs: [COMMENTS], name: "source", args: {name: "comment", http: {baseURL: "http://localhost:3030"}})
{
  query: Query
}

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

type Address
  @join__type(graph: USERS)
{
  streetAddress1: String!
  streetAddress2: String
  city: String!
  state: String!
  postCode: String!
  country: String!
}

enum CacheControlScope
  @join__type(graph: POSTS)
  @join__type(graph: USERS)
{
  PUBLIC @join__enumValue(graph: POSTS) @join__enumValue(graph: USERS)
  PRIVATE @join__enumValue(graph: POSTS) @join__enumValue(graph: USERS)
}

type Comment
  @join__type(graph: COMMENTS)
{
  id: ID!
  post_id: ID!
  content: String!
  author: ID!
}

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar join__DirectiveArguments

scalar join__FieldSet

scalar join__FieldValue

enum join__Graph {
  COMMENTS @join__graph(name: "comments", url: "http://comments")
  POSTS @join__graph(name: "posts", url: "http://localhost:4002")
  USERS @join__graph(name: "users", url: "http://localhost:4001")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

type Post
  @join__type(graph: COMMENTS, key: "id")
  @join__type(graph: POSTS, key: "id")
  @join__type(graph: USERS, key: "id")
  @join__directive(graphs: [COMMENTS, POSTS], name: "federation__cacheTag", args: {format: "post-{$key.id}"})
  @join__directive(graphs: [POSTS], name: "federation__cacheTag", args: {format: "post"})
{
  id: ID!
  comments: [Comment!] @join__field(graph: COMMENTS) @join__directive(graphs: [COMMENTS], name: "connect", args: {source: "comment", http: {GET: "/comment?post_id={$this.id}", headers: [{name: "Cache-Control", from: "Cache-Control"}]}, selection: "id\npost_id\ncontent\nauthor"})
  title: String! @join__field(graph: POSTS)
  content: String! @join__field(graph: POSTS) @join__field(graph: USERS, external: true)
  author: User! @join__field(graph: POSTS)
  featuredImage: String @join__field(graph: POSTS)
}

type Query
  @join__type(graph: COMMENTS)
  @join__type(graph: POSTS)
  @join__type(graph: USERS)
{
  posts: [Post!]! @join__field(graph: POSTS) @join__directive(graphs: [POSTS], name: "federation__cacheTag", args: {format: "posts"})
  post(id: ID!): Post! @join__field(graph: POSTS)
  user(id: ID!): User @join__field(graph: USERS)
  users: [User!]! @join__field(graph: USERS)
}

type User
  @join__type(graph: POSTS, key: "id")
  @join__type(graph: USERS, key: "id")
  @join__directive(graphs: [USERS], name: "federation__cacheTag", args: {format: "post-{$key.id}"})
{
  id: ID!
  posts: [Post!]! @join__field(graph: POSTS) @join__field(graph: USERS, external: true)
  name: String! @join__field(graph: USERS)
  email: String! @join__field(graph: USERS)
  bio: String! @join__field(graph: USERS, requires: "posts {content}")
  address: Address! @join__field(graph: USERS)
}
